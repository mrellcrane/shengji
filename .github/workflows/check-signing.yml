name: Check App Store Connect secrets

# Verifies the TestFlight secrets without printing them: the key parses, the API accepts it,
# the bundle ID and app record exist, the Team ID matches, and the key can manage signing.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-signing.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pyjwt[crypto]==2.9.0"
      - name: Check secrets against App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.mrellcrane.shengji
        shell: python
        run: |
          import json, os, re, sys, time, urllib.request, urllib.error, urllib.parse
          import jwt
          from cryptography.hazmat.primitives.serialization import load_pem_private_key

          ok = True
          def report(name, passed, detail=""):
              global ok
              ok = ok and passed
              print(("PASS " if passed else "FAIL ") + name + (": " + detail if detail else ""))

          key_id = os.environ.get("ASC_KEY_ID", "").strip()
          issuer = os.environ.get("ASC_ISSUER_ID", "").strip()
          p8 = os.environ.get("ASC_KEY_P8", "").strip()
          team = os.environ.get("APPLE_TEAM_ID", "").strip()
          bundle = os.environ["BUNDLE_ID"]

          report("ASC_KEY_ID present and well-formed", bool(re.fullmatch(r"[A-Z0-9]{10}", key_id)),
                 f"{len(key_id)} chars" + ("" if re.fullmatch(r"[A-Z0-9]{10}", key_id) else " (expected 10 letters/digits)"))
          report("ASC_ISSUER_ID present and well-formed",
                 bool(re.fullmatch(r"[0-9a-fA-F-]{36}", issuer)), f"{len(issuer)} chars (expected a 36-char UUID)")
          report("APPLE_TEAM_ID present and well-formed", bool(re.fullmatch(r"[A-Z0-9]{10}", team)),
                 f"{len(team)} chars (expected 10)")
          has_pem = "BEGIN PRIVATE KEY" in p8 and "END PRIVATE KEY" in p8
          report("ASC_KEY_P8 has BEGIN/END lines", has_pem)
          key = None
          if has_pem:
              try:
                  key = load_pem_private_key(p8.encode(), password=None)
                  report("ASC_KEY_P8 parses as a private key", True, type(key).__name__)
              except Exception as e:
                  report("ASC_KEY_P8 parses as a private key", False, type(e).__name__)
          if key is None or not key_id or not issuer:
              print("Cannot call the API without a valid key, key ID and issuer ID.")
              sys.exit(1)

          now = int(time.time())
          token = jwt.encode({"iss": issuer, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                             p8, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})

          def get(path, params=None):
              url = "https://api.appstoreconnect.apple.com" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      body = json.load(e)
                  except Exception:
                      body = {}
                  return e.code, body

          def err(body):
              errs = body.get("errors") or [{}]
              return f"{errs[0].get('code', '')}: {errs[0].get('detail', '')}".strip(": ")

          status, body = get("/v1/apps", {"limit": 200, "fields[apps]": "name,bundleId,sku"})
          report("API accepts the key (list apps)", status == 200, f"HTTP {status} {err(body) if status != 200 else ''}".strip())
          if status != 200:
              sys.exit(1)
          apps = body.get("data", [])
          print(f"INFO Key can see {len(apps)} app(s) on this team.")
          match = [a for a in apps if a["attributes"].get("bundleId") == bundle]
          report(f"App record exists for {bundle}", bool(match),
                 (f"name '{match[0]['attributes'].get('name')}', SKU '{match[0]['attributes'].get('sku')}'" if match
                  else "create it in App Store Connect: Apps > + > New App"))

          status, body = get("/v1/bundleIds", {"filter[identifier]": bundle, "fields[bundleIds]": "identifier,seedId,platform"})
          ids = [b for b in body.get("data", []) if b["attributes"].get("identifier") == bundle] if status == 200 else []
          report(f"Bundle ID {bundle} registered", bool(ids), f"HTTP {status}" + ("" if status == 200 else " " + err(body)))
          if ids:
              seed = ids[0]["attributes"].get("seedId", "")
              report("APPLE_TEAM_ID matches the bundle ID's team", seed == team,
                     "match" if seed == team else "the Team ID secret differs from the team that owns this bundle ID")

          status, body = get("/v1/certificates", {"limit": 1})
          report("Key can access certificates (needed for automatic signing)", status == 200,
                 f"HTTP {status}" + ("" if status == 200 else " " + err(body)))

          status, body = get("/v1/users", {"limit": 1})
          if status == 200:
              print("PASS Key looks like an Admin key (can list users), good for cloud-managed signing")
          else:
              print(f"WARN Key cannot list users (HTTP {status}); it is probably not Admin. "
                    "Cloud-managed distribution signing may fail; an Admin key is safest.")

          print()
          print("ALL REQUIRED CHECKS PASSED" if ok else "SOME CHECKS FAILED (see FAIL lines above)")
          sys.exit(0 if ok else 1)
