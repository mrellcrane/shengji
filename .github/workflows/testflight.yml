name: TestFlight

# Archives the app, signs it with your App Store Connect API key (automatic, cloud-managed signing)
# and uploads it to TestFlight. Run it from the Actions tab ("Run workflow").
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      App Store Connect API key ID (e.g. ABC123DEFG)
#   ASC_ISSUER_ID   Issuer ID shown above the keys list
#   ASC_KEY_P8      Full contents of the AuthKey_XXXX.p8 file, including the BEGIN/END lines
#   APPLE_TEAM_ID   Your 10-character Team ID
# The key needs the Admin role (cloud-managed distribution signing needs it).

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; missing=1; fi
          done
          exit $missing

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Shengji.xcodeproj -scheme Shengji -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shengji.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee archive.log
        
      - name: Show archive errors
        if: failure()
        run: grep -E "error:|Signing|provision" archive.log | sort -u | head -150 || true

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Shengji.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          echo "Uploaded build $BUILD_NUMBER. It shows up in TestFlight after Apple finishes processing (usually 5 to 15 minutes)."

      - name: Show export errors
        if: failure()
        run: grep -E "error|Error" export.log | sort -u | head -150 || true

      - name: Ensure an internal testing group with the account holder
        if: success()
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.mrellcrane.shengji
        run: |
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.9.0" || python3 -m pip install --quiet "pyjwt[crypto]==2.9.0"
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          import jwt
          key_id, issuer, p8 = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"], os.environ["ASC_KEY_P8"]
          now = int(time.time())
          token = jwt.encode({"iss": issuer, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                             p8, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          def call(method, path, body=None, params=None):
              url = "https://api.appstoreconnect.apple.com" + path + ("?" + urllib.parse.urlencode(params) if params else "")
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                                           headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, {"raw": raw.decode(errors="replace")}
          status, apps = call("GET", "/v1/apps", params={"filter[bundleId]": os.environ["BUNDLE_ID"]})
          app_id = apps["data"][0]["id"]
          status, groups = call("GET", f"/v1/apps/{app_id}/betaGroups", params={"limit": 50})
          group = next((g for g in groups.get("data", []) if g["attributes"].get("isInternalGroup")), None)
          if group is None:
              status, created = call("POST", "/v1/betaGroups", {"data": {"type": "betaGroups",
                  "attributes": {"name": "Internal testers", "isInternalGroup": True, "hasAccessToAllBuilds": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}})
              print("create group:", status)
              group = created.get("data")
          if not group:
              print("::warning::Could not find or create an internal testing group"); raise SystemExit(0)
          print("internal group:", group["attributes"].get("name"))
          status, users = call("GET", "/v1/users", params={"limit": 200})
          holders = [u for u in users.get("data", []) if "ACCOUNT_HOLDER" in (u["attributes"].get("roles") or [])]
          people = holders or users.get("data", [])[:1]
          status, testers = call("GET", f"/v1/betaGroups/{group['id']}/betaTesters", params={"limit": 200})
          existing = {t["attributes"].get("email", "").lower() for t in testers.get("data", [])}
          for u in people:
              a = u["attributes"]
              email = (a.get("username") or a.get("email") or "").lower()
              if not email or email in existing:
                  print("tester already in group"); continue
              status, body = call("POST", "/v1/betaTesters", {"data": {"type": "betaTesters",
                  "attributes": {"email": email, "firstName": a.get("firstName") or "", "lastName": a.get("lastName") or ""},
                  "relationships": {"betaGroups": {"data": [{"type": "betaGroups", "id": group["id"]}]}}}})
              print("add tester:", status, "" if status < 300 else json.dumps(body)[:400])
          PY

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
