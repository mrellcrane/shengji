name: CI

# Core logic tests on Linux, an iOS Simulator build of the app on macOS, and simulator
# screenshots of every demo scene (downloadable as the "screenshots" artifact).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run ShengjiCore tests
        working-directory: ShengjiCore
        run: swift test

  ios-build:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same script as in the screenshots job; keep the two copies identical.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          python3 - > "$RUNNER_TEMP/xcode.env" <<'PY'
          import glob, json, os, plistlib, re, subprocess, sys

          # The newest stable Xcode whose iOS Simulator runtime is installed. Runner images can
          # carry an Xcode without its runtime, and such an Xcode cannot build for the simulator.
          # Betas come last; if no Xcode has its runtime, take the newest stable one anyway.
          def numbers(text):
              return tuple(int(n) for n in re.findall(r"\d+", text))

          names = {}  # real path -> every name it is installed under (the runner adds symlinks)
          for path in glob.glob("/Applications/Xcode*.app"):
              names.setdefault(os.path.realpath(path), set()).add(os.path.basename(path).lower())
          if not names:
              sys.exit("No Xcode found in /Applications")

          candidates = []
          for app, aliases in names.items():
              try:
                  with open(os.path.join(app, "Contents/version.plist"), "rb") as f:
                      version = numbers(plistlib.load(f)["CFBundleShortVersionString"])
              except (OSError, KeyError, ValueError, plistlib.InvalidFileException):
                  version = numbers(os.path.basename(app))
              sdk_dir = "Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs"
              sdks = [numbers(os.path.basename(p))[:2]
                      for p in glob.glob(os.path.join(app, sdk_dir, "iPhoneSimulator[0-9]*.sdk"))]
              beta = any("beta" in a for a in aliases)
              candidates.append((not beta, version, app, max(sdks, default=())))
          candidates.sort(reverse=True)

          def ios_runtimes(app):
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(app, "Contents/Developer"))
              try:
                  out = subprocess.run(["xcrun", "simctl", "list", "-j", "runtimes"], env=env,
                                       capture_output=True, text=True, timeout=300, check=True).stdout
                  runtimes = json.loads(out).get("runtimes", [])
              except (OSError, subprocess.SubprocessError, ValueError) as error:
                  print(f"Could not list simulator runtimes with {app}: {error}", file=sys.stderr)
                  return set()
              found = set()
              for runtime in runtimes:
                  m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime.get("identifier", ""))
                  if m and runtime.get("isAvailable", True):
                      found.add((int(m.group(1)), int(m.group(2))))
              return found

          chosen = None
          for _, _, app, sdk in candidates:
              if sdk and sdk in ios_runtimes(app):
                  chosen = (app, sdk)
                  break
              sdk_name = ".".join(str(n) for n in sdk) or "(none)"
              print(f"Skipping {app}: its iOS {sdk_name} simulator runtime is not installed", file=sys.stderr)
          if chosen is None:
              chosen = (candidates[0][2], candidates[0][3])
              print("No Xcode has its simulator runtime installed; using the newest one", file=sys.stderr)
          print(f"XCODE_APP={chosen[0]}")
          print("IOS_SIM_SDK=" + ".".join(str(n) for n in chosen[1]))
          PY
          XCODE_APP=$(sed -n 's/^XCODE_APP=//p' "$RUNNER_TEMP/xcode.env")
          cat "$RUNNER_TEMP/xcode.env" >> "$GITHUB_ENV"
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Shengji.xcodeproj -scheme Shengji \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/dd \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore

  screenshots:
    name: Simulator screenshots
    needs: ios-build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.mrellcrane.shengji
      APP_PATH: build/dd/Build/Products/Debug-iphonesimulator/Shengji.app
    steps:
      - uses: actions/checkout@v4

      # Same script as in the ios-build job; keep the two copies identical.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          python3 - > "$RUNNER_TEMP/xcode.env" <<'PY'
          import glob, json, os, plistlib, re, subprocess, sys

          # The newest stable Xcode whose iOS Simulator runtime is installed. Runner images can
          # carry an Xcode without its runtime, and such an Xcode cannot build for the simulator.
          # Betas come last; if no Xcode has its runtime, take the newest stable one anyway.
          def numbers(text):
              return tuple(int(n) for n in re.findall(r"\d+", text))

          names = {}  # real path -> every name it is installed under (the runner adds symlinks)
          for path in glob.glob("/Applications/Xcode*.app"):
              names.setdefault(os.path.realpath(path), set()).add(os.path.basename(path).lower())
          if not names:
              sys.exit("No Xcode found in /Applications")

          candidates = []
          for app, aliases in names.items():
              try:
                  with open(os.path.join(app, "Contents/version.plist"), "rb") as f:
                      version = numbers(plistlib.load(f)["CFBundleShortVersionString"])
              except (OSError, KeyError, ValueError, plistlib.InvalidFileException):
                  version = numbers(os.path.basename(app))
              sdk_dir = "Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs"
              sdks = [numbers(os.path.basename(p))[:2]
                      for p in glob.glob(os.path.join(app, sdk_dir, "iPhoneSimulator[0-9]*.sdk"))]
              beta = any("beta" in a for a in aliases)
              candidates.append((not beta, version, app, max(sdks, default=())))
          candidates.sort(reverse=True)

          def ios_runtimes(app):
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(app, "Contents/Developer"))
              try:
                  out = subprocess.run(["xcrun", "simctl", "list", "-j", "runtimes"], env=env,
                                       capture_output=True, text=True, timeout=300, check=True).stdout
                  runtimes = json.loads(out).get("runtimes", [])
              except (OSError, subprocess.SubprocessError, ValueError) as error:
                  print(f"Could not list simulator runtimes with {app}: {error}", file=sys.stderr)
                  return set()
              found = set()
              for runtime in runtimes:
                  m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime.get("identifier", ""))
                  if m and runtime.get("isAvailable", True):
                      found.add((int(m.group(1)), int(m.group(2))))
              return found

          chosen = None
          for _, _, app, sdk in candidates:
              if sdk and sdk in ios_runtimes(app):
                  chosen = (app, sdk)
                  break
              sdk_name = ".".join(str(n) for n in sdk) or "(none)"
              print(f"Skipping {app}: its iOS {sdk_name} simulator runtime is not installed", file=sys.stderr)
          if chosen is None:
              chosen = (candidates[0][2], candidates[0][3])
              print("No Xcode has its simulator runtime installed; using the newest one", file=sys.stderr)
          print(f"XCODE_APP={chosen[0]}")
          print("IOS_SIM_SDK=" + ".".join(str(n) for n in chosen[1]))
          PY
          XCODE_APP=$(sed -n 's/^XCODE_APP=//p' "$RUNNER_TEMP/xcode.env")
          cat "$RUNNER_TEMP/xcode.env" >> "$GITHUB_ENV"
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list -j devices available > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY'
          import json, os, re, sys

          # Prefer the newest plain or Pro "iPhone 17" / "iPhone 16" (not Plus or Pro Max)
          # on the newest iOS runtime; otherwise any iPhone on the newest runtime. Only runtimes
          # up to the selected Xcode's iOS SDK count: Xcode cannot run a newer runtime (for
          # example one installed for a beta Xcode).
          sdk = tuple(int(n) for n in re.findall(r"\d+", os.environ.get("IOS_SIM_SDK", "")))[:2]
          devices = json.load(open(sys.argv[1])).get("devices", {})
          best = None
          for runtime, items in devices.items():
              m = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime)
              if not m:
                  continue
              version = tuple(int(x) for x in m.group(1).split("-") if x)
              for d in items:
                  name = d.get("name", "")
                  if not name.startswith("iPhone") or not d.get("isAvailable", True):
                      continue
                  pm = re.fullmatch(r"iPhone (1[67])( Pro)?", name)
                  key = (
                      1 if not sdk or version[:2] <= sdk else 0,  # the selected Xcode can run it
                      1 if pm else 0,             # preferred model family
                      int(pm.group(1)) if pm else 0,  # iPhone 17 over iPhone 16
                      version,                    # newest runtime
                      1 if pm and not pm.group(2) else 0,  # plain over Pro
                  )
                  if best is None or key > best[0]:
                      best = (key, d["udid"], name, runtime)
          if best is None:
              sys.exit("No available iPhone simulator found")
          _, udid, name, runtime = best
          print(f"Chose {name} ({runtime}) {udid}", file=sys.stderr)
          print(f"SIM_UDID={udid}")
          print(f"SIM_NAME={name}")
          PY

      - name: Build for the simulator
        run: |
          set -o pipefail
          echo "Building for $SIM_NAME ($SIM_UDID)"
          xcodebuild -project Shengji.xcodeproj -scheme Shengji \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -configuration Debug -derivedDataPath build/dd \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Boot simulator and install the app
        run: |
          set -euo pipefail
          test -d "$APP_PATH" || { echo "::error::App not found at $APP_PATH"; exit 1; }
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance light || true
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          # Warm-up launch (a demo scene, so saved progress is never touched): the first launch is slower.
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -ScreenshotScene learn || true
          sleep 8
          for scene in learn lesson predict review quiz game dealing result rules; do
            echo "Scene: $scene"
            xcrun simctl launch --terminate-running-process "$SIM_UDID" "$BUNDLE_ID" -ScreenshotScene "$scene" || true
            sleep 6
            xcrun simctl io "$SIM_UDID" screenshot "screenshots/$scene.png" || true
          done
          ls -la screenshots

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p screenshots/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Shengji*' -exec cp {} screenshots/crash-reports/ \; 2>/dev/null || true
          if [ -n "$(ls -A screenshots/crash-reports)" ]; then
            echo "::warning::The app crashed during screenshots; see crash-reports in the screenshots artifact."
            ls -la screenshots/crash-reports
          else
            rmdir screenshots/crash-reports
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
