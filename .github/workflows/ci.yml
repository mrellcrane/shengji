name: CI

# Core logic tests on Linux, an iOS Simulator build of the app on macOS, and simulator
# screenshots of every demo scene (downloadable as the "screenshots" artifact).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run ShengjiCore tests
        working-directory: ShengjiCore
        run: swift test

  ios-build:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          # Newest stable Xcode on the runner; fall back to a beta only if nothing else is installed.
          # Xcode bundle names never contain spaces, so listing them with ls is safe here.
          # shellcheck disable=SC2010,SC2012
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            # shellcheck disable=SC2012
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Shengji.xcodeproj -scheme Shengji \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/dd \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore

  screenshots:
    name: Simulator screenshots
    needs: ios-build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.mrellcrane.shengji
      APP_PATH: build/dd/Build/Products/Debug-iphonesimulator/Shengji.app
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          # shellcheck disable=SC2010,SC2012
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            # shellcheck disable=SC2012
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys

          # Prefer the newest plain or Pro "iPhone 17" / "iPhone 16" (not Plus or Pro Max)
          # on the newest iOS runtime; otherwise any iPhone on the newest runtime.
          devices = json.load(open(sys.argv[1])).get("devices", {})
          best = None
          for runtime, items in devices.items():
              m = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime)
              if not m:
                  continue
              version = tuple(int(x) for x in m.group(1).split("-") if x)
              for d in items:
                  name = d.get("name", "")
                  if not name.startswith("iPhone") or not d.get("isAvailable", True):
                      continue
                  pm = re.fullmatch(r"iPhone (1[67])( Pro)?", name)
                  key = (
                      1 if pm else 0,             # preferred model family
                      int(pm.group(1)) if pm else 0,  # iPhone 17 over iPhone 16
                      version,                    # newest runtime
                      1 if pm and not pm.group(2) else 0,  # plain over Pro
                  )
                  if best is None or key > best[0]:
                      best = (key, d["udid"], name, runtime)
          if best is None:
              sys.exit("No available iPhone simulator found")
          _, udid, name, runtime = best
          print(f"Chose {name} ({runtime}) {udid}", file=sys.stderr)
          print(f"SIM_UDID={udid}")
          print(f"SIM_NAME={name}")
          PY

      - name: Build for the simulator
        run: |
          set -o pipefail
          echo "Building for $SIM_NAME ($SIM_UDID)"
          xcodebuild -project Shengji.xcodeproj -scheme Shengji \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -configuration Debug -derivedDataPath build/dd \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Boot simulator and install the app
        run: |
          set -euo pipefail
          test -d "$APP_PATH" || { echo "::error::App not found at $APP_PATH"; exit 1; }
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance light || true
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          # Warm-up launch (a demo scene, so saved progress is never touched): the first launch is slower.
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -ScreenshotScene learn || true
          sleep 8
          for scene in learn lesson predict review quiz game dealing result rules; do
            echo "Scene: $scene"
            xcrun simctl launch --terminate-running-process "$SIM_UDID" "$BUNDLE_ID" -ScreenshotScene "$scene" || true
            sleep 6
            xcrun simctl io "$SIM_UDID" screenshot "screenshots/$scene.png" || true
          done
          ls -la screenshots

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p screenshots/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Shengji*' -exec cp {} screenshots/crash-reports/ \; 2>/dev/null || true
          if [ -n "$(ls -A screenshots/crash-reports)" ]; then
            echo "::warning::The app crashed during screenshots; see crash-reports in the screenshots artifact."
            ls -la screenshots/crash-reports
          else
            rmdir screenshots/crash-reports
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
